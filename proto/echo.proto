syntax = "proto3";

package echo;

option go_package = "grpc-echo-service/proto";

// سرویس Echo - یک متد ساده داره که پیام میگیره و پیام برمیگردونه
service EchoService {
  rpc Echo (EchoRequest) returns (EchoResponse);
}

// پیامی که کلاینت می‌فرسته
message EchoRequest {
  string message = 1;
}

// پیامی که سرور برمی‌گردونه
message EchoResponse {
  string message = 1;
}
